services:
  postgres:
    image: postgres:15-alpine
    container_name: pos-minimarket-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
      POSTGRES_DB: ${POSTGRES_DB:-pos_minimarket}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./backend/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      # Hanya localhost agar database tidak terekspos ke LAN.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pos_minimarket}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: pos-minimarket-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-pos_minimarket}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PORT: 5000
      # Wajib diisi di .env; tanpa nilai ini deploy gagal (tidak ada fallback).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi di .env (minimal 16 karakter acak)}
      JWT_EXPIRES: ${JWT_EXPIRES:-12h}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      # Akun awal. Bila kosong, backend membuat password acak dan mencetaknya ke log.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Administrator}
      KASIR_USERNAME: ${KASIR_USERNAME:-kasir}
      KASIR_PASSWORD: ${KASIR_PASSWORD:-}
      KASIR_FULL_NAME: ${KASIR_FULL_NAME:-Kasir Satu}
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-5002}:5000"

  frontend:
    build: .
    container_name: pos-minimarket-frontend
    ports:
      - "${FRONTEND_HOST_PORT:-9998}:80"
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
